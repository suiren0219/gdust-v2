name: CI

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM / Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :nexioui:jvmTest --stacktrace

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-37" >/dev/null || true
          fi
      - name: Assemble Android
        run: ./gradlew :nexioui:assembleAndroidMain --stacktrace

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexioui
      # JitPack 只发布 softglass 的 android / jvm 制品，没有 iOS klib。
      # 这里把 softglass 源码并排拉下来，让 includeBuild 走源码编译。
      - uses: actions/checkout@v4
        with:
          repository: HaoZai000/SoftGlass
          ref: 0.1.3
          path: softglass
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS Simulator
        working-directory: nexioui
        run: ./gradlew :nexioui:compileKotlinIosSimulatorArm64 --stacktrace
