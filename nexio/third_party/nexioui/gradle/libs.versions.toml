# NexioUI - 依赖版本目录
[versions]
agp = "9.2.1"
kotlin = "2.4.10"
composeMultiplatform = "1.12.0"
kotlinxCoroutines = "1.9.0"
kotlinxDatetime = "0.6.2"
softglass = "0.1.3"
navigationevent = "1.1.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
softglass = { module = "com.github.HaoZai000.SoftGlass:softglass", version.ref = "softglass" }
navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
